# bridge.yaml — ROS2 ↔ Gazebo Harmonic
# À placer dans : duckiebot_description/config/bridge.yaml

# /joint_states : Gazebo → ROS2
- ros_topic_name: /joint_states
  gz_topic_name: /world/duckietown_world/model/duckiebot/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# /tf : Gazebo → ROS2
- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# /odom : Gazebo → ROS2
- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# /cmd_vel : ROS2 → Gazebo
- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
